
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1">
<title>ShopPilot V3 - Gestion commerciale</title>
<style>
* { box-sizing: border-box; }
body {
 margin: 0;
 font-family: Arial, sans-serif;
 background: #f3f6fb;
 color: #17243a;
}
header {
 background: #123b86;
 color: white;
 padding: 22px 16px;
}
header h1 { margin: 0; }
header p { margin-bottom: 0; }
main {
 max-width: 900px;
 margin: auto;
 padding: 16px;
}
.cards {
 display: grid;
 grid-template-columns: repeat(2, 1fr);
 gap: 12px;
}
.card, .panel {
 background: white;
 padding: 18px;
 border-radius: 12px;
 margin-bottom: 14px;
 box-shadow: 0 2px 8px #0000000b;
}
.card strong {
 font-size: 23px;
 color: #123b86;
 overflow-wrap: anywhere;
}
input, select {
 width: 100%;
 padding: 12px;
 margin: 6px 0 12px;
 border: 1px solid #ccd4e0;
 border-radius: 8px;
 font-size: 16px;
}
button {
 background: #123b86;
 color: white;
 border: none;
 border-radius: 8px;
 padding: 12px;
 margin: 3px 3px 3px 0;
 cursor: pointer;
}
button:disabled {
 opacity: .5;
 cursor: not-allowed;
}
.secondary { background: #475569; }
.danger { background: #b42318; }
.item {
 padding: 14px 0;
 border-bottom: 1px solid #e2e8f0;
}
.item h3 { margin-bottom: 6px; }
.alert {
 color: #9a3412;
 background: #ffedd5;
 padding: 8px;
 border-radius: 6px;
}
.ok { color: #166534; }
small { color: #64748b; }
</style>
</head>
<body>

<header>
<h1>ShopPilot</h1>
<p>Votre boutique, votre réussite.</p>
</header>

<main>

<section class="panel">
<h2>Ma boutique</h2>
<input id="boutique"
 placeholder="Nom de votre boutique">
<button onclick="sauverBoutique()">
Enregistrer le nom
</button>
</section>

<h2>Tableau de bord</h2>
<div class="cards">
<div class="card">
<p>Chiffre d'affaires</p>
<strong id="ca">0</strong>
</div>
<div class="card">
<p>Ventes</p>
<strong id="nbVentes">0</strong>
</div>
<div class="card">
<p>Produits</p>
<strong id="nbProduits">0</strong>
</div>
<div class="card">
<p>Stocks faibles</p>
<strong id="faibles">0</strong>
</div>
</div>

<section class="panel">
<h2>Enregistrer une vente</h2>
<form id="formVente">
<label for="produitVente">Produit</label>
<select id="produitVente" required></select>

<label for="quantiteVente">Quantité vendue</label>
<input id="quantiteVente" type="number"
 min="1" step="1" value="1" required>

<button type="submit">
Enregistrer la vente
</button>
</form>
</section>

<section class="panel">
<h2>Ajouter un produit</h2>
<form id="formProduit">
<label for="nom">Nom du produit</label>
<input id="nom" required maxlength="100"
 placeholder="Ex : Ordinateur HP">

<label for="prix">Prix de vente</label>
<input id="prix" type="number"
 min="0.01" step="0.01" required
 placeholder="Ex : 350">

<label for="stock">Quantité en stock</label>
<input id="stock" type="number"
 min="0" step="1" required
 placeholder="Ex : 10">

<button type="submit">Ajouter le produit</button>
</form>
</section>

<section class="panel">
<h2>Mes produits</h2>
<input id="recherche"
 placeholder="Rechercher un produit">
<div id="liste"></div>
</section>

<section class="panel">
<h2>Historique des ventes</h2>
<div id="historique"></div>
</section>

</main>

<script>
const cleProduits = "shoppilot_produits_v1";
const cleVentes = "shoppilot_ventes_v1";
const cleBoutique = "shoppilot_boutique";

let catalogue = [];
let ventes = [];

function charger(cle) {
 try {
  const donnees = JSON.parse(
   localStorage.getItem(cle) || "[]"
  );
  return Array.isArray(donnees) ? donnees : [];
 } catch (e) {
  return [];
 }
}

catalogue = charger(cleProduits);
ventes = charger(cleVentes);

const champBoutique =
 document.getElementById("boutique");

champBoutique.value =
 localStorage.getItem(cleBoutique) || "";

function sauverBoutique() {
 const nom = champBoutique.value.trim();
 if (!nom) {
  alert("Saisissez un nom de boutique.");
  return;
 }
 try {
  localStorage.setItem(cleBoutique, nom);
  alert("Nom enregistré !");
 } catch (e) {
  alert("Enregistrement impossible.");
 }
}

function argent(montant) {
 return Number(montant).toLocaleString(
  "fr-FR",
  {minimumFractionDigits: 2,
   maximumFractionDigits: 2}
 );
}

function sauvegarderProduits(nouveau) {
 try {
  localStorage.setItem(
   cleProduits, JSON.stringify(nouveau)
  );
  catalogue = nouveau;
  afficher();
  return true;
 } catch (e) {
  alert("Sauvegarde impossible.");
  return false;
 }
}

document.getElementById("formProduit")
 .addEventListener("submit", function(e) {
 e.preventDefault();

 const nom = document.getElementById(
  "nom"
 ).value.trim();
 const prix = Number(
  document.getElementById("prix").value
 );
 const stock = Number(
  document.getElementById("stock").value
 );

 if (!nom || !Number.isFinite(prix)
  || prix <= 0
  || !Number.isSafeInteger(stock)
  || stock < 0) {
  alert("Informations invalides.");
  return;
 }

 const produit = {
  id: Date.now() + "-" +
   Math.random().toString(36).slice(2),
  nom, prix, stock
 };

 if (sauvegarderProduits(
  [...catalogue, produit]
 )) this.reset();
});

function modifier(id) {
 const p = catalogue.find(
  x => String(x.id) === String(id)
 );
 if (!p) return;

 const saisieNom = prompt(
  "Nom du produit :", p.nom
 );
 if (saisieNom === null) return;
 const nom = saisieNom.trim();

 if (!nom || nom.length > 100) {
  alert("Nom invalide.");
  return;
 }

 const saisiePrix = prompt(
  "Prix du produit :", p.prix
 );
 if (saisiePrix === null) return;
 const prix = Number(saisiePrix);

 if (!saisiePrix.trim()
  || !Number.isFinite(prix)
  || prix <= 0) {
  alert("Prix invalide.");
  return;
 }

 const saisieStock = prompt(
  "Quantité en stock :", p.stock
 );
 if (saisieStock === null) return;
 const stock = Number(saisieStock);

 if (!saisieStock.trim()
  || !Number.isSafeInteger(stock)
  || stock < 0) {
  alert("Stock invalide.");
  return;
 }

 const nouveau = catalogue.map(
  x => String(x.id) === String(id)
   ? {...x, nom, prix, stock} : x
 );
 sauvegarderProduits(nouveau);
}

function changerStock(id, variation) {
 const p = catalogue.find(
  x => String(x.id) === String(id)
 );
 if (!p) return;

 const stock = Number(p.stock) + variation;
 if (!Number.isSafeInteger(stock)
  || stock < 0) {
  alert("Stock insuffisant.");
  return;
 }

 sauvegarderProduits(catalogue.map(
  x => String(x.id) === String(id)
   ? {...x, stock} : x
 ));
}

function supprimer(id) {
 if (!confirm("Supprimer ce produit ?"))
  return;

 sauvegarderProduits(catalogue.filter(
  x => String(x.id) !== String(id)
 ));
}

document.getElementById("formVente")
 .addEventListener("submit", function(e) {
 e.preventDefault();

 const id = document.getElementById(
  "produitVente"
 ).value;
 const quantite = Number(
  document.getElementById(
   "quantiteVente"
  ).value
 );

 const p = catalogue.find(
  x => String(x.id) === id
 );

 if (!p || !Number.isSafeInteger(quantite)
  || quantite <= 0) {
  alert("Vente invalide.");
  return;
 }

 if (!Number.isSafeInteger(Number(p.stock))
  || Number(p.stock) < quantite) {
  alert("Stock insuffisant !");
  return;
 }

 const prix = Number(p.prix);
 const total = Math.round(
  prix * quantite * 100
 ) / 100;

 if (!Number.isFinite(total)
  || !Number.isSafeInteger(
   Math.round(total * 100)
  )) {
  alert("Montant invalide.");
  return;
 }

 const vente = {
  id: Date.now() + "-" +
   Math.random().toString(36).slice(2),
  produit: p.nom,
  quantite,
  prix,
  total,
  date: new Date().toISOString()
 };

 const nouveauCatalogue = catalogue.map(
  x => String(x.id) === id
   ? {...x, stock: Number(x.stock) - quantite}
   : x
 );
 const nouvellesVentes = [...ventes, vente];

 // Enregistrer les deux données avec
 // restauration en cas d'échec.
 const ancienneValeur =
  localStorage.getItem(cleProduits);

 try {
  localStorage.setItem(
   cleProduits,
   JSON.stringify(nouveauCatalogue)
  );
  localStorage.setItem(
   cleVentes,
   JSON.stringify(nouvellesVentes)
  );
 } catch (erreur) {
  try {
   if (ancienneValeur === null) {
    localStorage.removeItem(cleProduits);
   } else {
    localStorage.setItem(
     cleProduits, ancienneValeur
    );
   }
  } catch (e) {}
  alert("Enregistrement de vente impossible.");
  return;
 }

 catalogue = nouveauCatalogue;
 ventes = nouvellesVentes;
 afficher();
 this.reset();
 alert("Vente enregistrée !");
});

function creerBouton(texte, action, classe) {
 const b = document.createElement("button");
 b.textContent = texte;
 if (classe) b.className = classe;
 b.addEventListener("click", action);
 return b;
}

function afficher() {
 document.getElementById(
  "nbProduits"
 ).textContent = catalogue.length;

 document.getElementById(
  "nbVentes"
 ).textContent = ventes.length;

 const totalCA = ventes.reduce(
  (somme, v) => somme + Number(v.total), 0
 );

 document.getElementById(
  "ca"
 ).textContent = argent(totalCA);

 document.getElementById(
  "faibles"
 ).textContent = catalogue.filter(
  p => Number(p.stock) <= 5
 ).length;

 afficherSelect();
 afficherProduits();
 afficherVentes();
}

function afficherSelect() {
 const select = document.getElementById(
  "produitVente"
 );
 const precedent = select.value;
 select.replaceChildren();

 const disponibles = catalogue.filter(
  p => Number(p.stock) > 0
 );

 disponibles.forEach(p => {
  const option = document.createElement(
   "option"
  );
  option.value = String(p.id);
  option.textContent =
   p.nom + " - Stock : " + p.stock;
  select.appendChild(option);
 });

 if (disponibles.some(
  p => String(p.id) === precedent
 )) select.value = precedent;

 if (disponibles.length === 0) {
  const option = document.createElement(
   "option"
  );
  option.textContent = "Aucun produit disponible";
  option.value = "";
  select.appendChild(option);
 }

 document.querySelector(
  "#formVente button"
 ).disabled = disponibles.length === 0;
}

function afficherProduits() {
 const liste = document.getElementById(
  "liste"
 );
 const recherche = document.getElementById(
  "recherche"
 ).value.trim().toLowerCase();

 liste.replaceChildren();

 const resultats = catalogue.filter(
  p => String(p.nom).toLowerCase()
   .includes(recherche)
 );

 if (resultats.length === 0) {
  liste.textContent = "Aucun produit trouvé.";
  return;
 }

 resultats.forEach(p => {
  const div = document.createElement("div");
  div.className = "item";

  const titre = document.createElement("h3");
  titre.textContent = p.nom;

  const details = document.createElement("p");
  details.textContent =
   "Prix : " + argent(p.prix) +
   " | Stock : " + p.stock;

  const statut = document.createElement("p");
  if (Number(p.stock) === 0) {
   statut.textContent = "Rupture de stock";
   statut.className = "alert";
  } else if (Number(p.stock) <= 5) {
   statut.textContent = "Stock faible";
   statut.className = "alert";
  } else {
   statut.textContent = "Stock disponible";
   statut.className = "ok";
  }

  div.append(
   titre, details, statut,
   creerBouton(
    "Modifier", () => modifier(p.id)
   ),
   creerBouton(
    "+ Stock", () => changerStock(p.id, 1)
   ),
   creerBouton(
    "- Stock",
    () => changerStock(p.id, -1),
    "secondary"
   ),
   creerBouton(
    "Supprimer",
    () => supprimer(p.id),
    "danger"
   )
  );
  liste.appendChild(div);
 });
}

function afficherVentes() {
 const historique = document.getElementById(
  "historique"
 );
 historique.replaceChildren();

 if (ventes.length === 0) {
  historique.textContent =
   "Aucune vente enregistrée.";
  return;
 }

 [...ventes].reverse().forEach(v => {
  const div = document.createElement("div");
  div.className = "item";

  const titre = document.createElement("h3");
  titre.textContent = v.produit;

  const details = document.createElement("p");
  details.textContent =
   "Quantité : " + v.quantite +
   " | Prix : " + argent(v.prix) +
   " | Total : " + argent(v.total);

  const date = document.createElement("small");
  date.textContent = new Date(
   v.date
  ).toLocaleString("fr-FR");

  div.append(titre, details, date);
  historique.appendChild(div);
 });
}

document.getElementById("recherche")
 .addEventListener("input", afficherProduits);

afficher();
</script>
</body>
</html>
